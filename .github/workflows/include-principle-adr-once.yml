name: Include principle ADR once

on:
  push:
    branches: [repair/install-principle-adr]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: repair/install-principle-adr
      - name: Add ADR to base managed sources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('registry/registry.json')
          registry = json.loads(path.read_text())
          sources = registry['modules']['base']['sources']
          adr = 'docs/adr/0001-capability-internalization.md'
          if adr not in sources:
              sources.insert(sources.index('principles/README.md') + 1, adr)
          path.write_text(json.dumps(registry, indent=2) + '\n')
          PY
      - name: Verify registry source exists
        run: |
          test -f docs/adr/0001-capability-internalization.md
          grep -F 'docs/adr/0001-capability-internalization.md' registry/registry.json
      - name: Remove one-shot workflow
        run: rm .github/workflows/include-principle-adr-once.yml
      - name: Commit registry repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install referenced principle ADR with base conventions"
          git push origin HEAD:repair/install-principle-adr
