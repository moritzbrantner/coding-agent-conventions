name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate
        run: bun run check

  findings:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@b3f0eb95962e8f6642e170bf373a33a8bd80ca0f # main
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json

  tooling-fast:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@b3f0eb95962e8f6642e170bf373a33a8bd80ca0f # main
    with:
      operation: run
      tier: fast
      report_path: .artifacts/coding-tooling/fast.json
